name: Model pin check

# Nightly: compare catalog/model-artifacts.json (the quantized artifact each
# measured catalog model loads in the next run) and the publisher snapshots of
# the pinned models in catalog/models.json with Hugging Face. An artifact pin
# whose repository has a newer commit that still publishes every pinned file
# with a Git LFS sha256 is moved to that commit; a pinned model's publisher
# snapshot follows its repository's head commit with the metadata Hugging Face
# reports for it. One pull request is opened (or refreshed) with the result.
# What the check only reports lands in the PR body and in a tracking issue: a
# pinned file that is gone or cannot be verified, a moved publisher repository
# whose answer the catalog cannot record, a repository Hugging Face does not
# serve, a model measured in the published results without a pin, a pin whose
# base model is not the catalog's repository, and new repositories of the
# pinned models' publishers. A run refreshes the issue while something waits on a decision,
# and closes it once nothing does and no lookup failed. See docs/MODELS.md.
#
# Never touched: the published results under docs/results/ (they keep the
# revision they recorded). The check writes catalog/model-artifacts.json,
# catalog/models.json and the revision table of docs/MODELS.md, nothing else.
#
# The other nightly jobs: upstream-pins.yml (06:17 UTC) bumps the platform and
# package pins of catalog/installers.json, Dependabot (.github/dependabot.yml,
# 06:17 UTC) covers the ecosystem manifests, and model-discovery.yml
# (06:47 UTC) raises new LiveBench models in its own issue, where size and
# license are judged. This job runs after them, at 07:17 UTC.
#
# Tokens: as in upstream-pins.yml, the branch is pushed and the pull request
# opened with the UPSTREAM_BUMP_TOKEN secret (a fine-grained PAT with contents
# + pull-requests + issues: write), because the default GITHUB_TOKEN cannot
# open pull requests here and the ones it could open would not trigger
# harness-tests; the workflow falls back to GITHUB_TOKEN when the secret is
# absent. The tracking issue is always written with GITHUB_TOKEN, so that the
# workflow recognises its own issue by its author. HF_TOKEN is optional and
# only authenticates the Hugging Face requests.

on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC, after upstream-pins and Dependabot (06:17) and model discovery (06:47)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: model-pins
  cancel-in-progress: false

env:
  BRANCH: auto/model-pins
  PR_TITLE: "Bump pinned model revisions"
  ISSUE_TITLE: "Model versions needing a manual decision"
  ISSUE_LABEL: model-pins

jobs:
  check:
    name: resolve model pins + open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the script's network reads share a 15-minute deadline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push with the PAT too (not just the gh calls): GitHub never starts
          # workflow runs for pushes made with GITHUB_TOKEN.
          token: ${{ secrets.UPSTREAM_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve the model pins and apply the bumps
        id: resolve
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # optional
        run: |
          python3 scripts/model_pins.py --apply --summary /tmp/summary.md --issue-summary /tmp/issue.md --github-output
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      # A moved publisher snapshot rewrites the model catalog, which model
      # discovery validates (its Hugging Face anchors among it): run its offline
      # tests too, so a bump discovery would refuse never reaches a pull request.
      # When they refuse it, the run fails here and says why; the issue steps
      # below still run, and the issue is not closed that night.
      - name: Run the offline checks CI would
        id: checks
        if: steps.resolve.outputs.changed == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_model_pins.py' -v
          python3 -m unittest discover -s tests -p 'test_model_discovery.py' -v

      - name: Open or refresh the bump pull request
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "$PR_TITLE"
          # Skip the push when the open PR already carries exactly this content.
          if git fetch -q origin "$BRANCH" 2>/dev/null \
             && [ "$(git rev-parse "origin/$BRANCH^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "PR branch already up to date."
          else
            git push --force origin "$BRANCH"
          fi
          gh label create dependencies --description "Dependency and pin updates" --color 0366d6 --force >/dev/null
          existing="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$PR_TITLE" --body-file /tmp/summary.md
            echo "Refreshed PR #$existing"
          else
            gh pr create --head "$BRANCH" --base "$BASE" --title "$PR_TITLE" --body-file /tmp/summary.md --label dependencies
          fi

      - name: Read the tracking issue
        id: issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only an issue this workflow created counts: anyone can open one with this title. The issues endpoint
          # (no search index, so no lag) is filtered by the label, which only collaborators can apply, and by the
          # author, github-actions[bot], which only workflow tokens create issues as.
          mine='[.[] | select(.pull_request == null and .title == env.ISSUE_TITLE and .user.login == "github-actions[bot]")]'
          number="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=$ISSUE_LABEL&per_page=100" \
                    --jq "$mine | .[0].number // empty")"
          state=open
          if [ -z "$number" ]; then
            number="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=closed&labels=$ISSUE_LABEL&per_page=100" \
                      --jq "$mine | sort_by(.closed_at) | last | .number // empty")"
            state=closed
          fi
          if [ -z "$number" ]; then
            state=none
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      # Every run that leaves something waiting on a decision refreshes the
      # issue, including runs that also opened or refreshed the bump PR, so the
      # issue never shows an older night's upstream values. A closed issue is
      # reopened, not duplicated.
      - name: Refresh the tracking issue with what needs a manual decision
        if: ${{ !cancelled() && steps.resolve.outputs.manual == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
          CHANGED: ${{ steps.resolve.outputs.changed }}
          NUMBER: ${{ steps.issue.outputs.number }}
          STATE: ${{ steps.issue.outputs.state }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          note="Refreshed by the nightly model pin check ([run $RUN_ID]($RUN_URL))."
          if [ "$CHANGED" = "true" ]; then
            pr="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number')"
            if [ -n "$pr" ]; then note="$note This run's automatic bumps are in #$pr."; fi
          fi
          { printf '_%s_\n\n' "$note"; cat /tmp/issue.md; } > /tmp/issue-body.md
          gh label create "$ISSUE_LABEL" --description "Model versions needing a manual decision" --color 5319e7 --force >/dev/null
          case "$STATE" in
            open)   gh issue edit "$NUMBER" --body-file /tmp/issue-body.md
                    echo "Refreshed issue #$NUMBER" ;;
            closed) gh issue reopen "$NUMBER"
                    gh issue edit "$NUMBER" --body-file /tmp/issue-body.md
                    echo "Reopened issue #$NUMBER" ;;
            *)      gh issue create --title "$ISSUE_TITLE" --body-file /tmp/issue-body.md --label "$ISSUE_LABEL" ;;
          esac

      # A failed lookup settles nothing, and neither does a bump the offline
      # checks refused: that night the issue is never closed, because the
      # closing comment could be untrue.
      - name: Close the tracking issue once nothing needs a manual decision
        if: ${{ !cancelled() && steps.checks.outcome != 'failure' && steps.resolve.outputs.manual == 'false' && steps.resolve.outputs.failed == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.issue.outputs.number }}
          STATE: ${{ steps.issue.outputs.state }}
        run: |
          set -euo pipefail
          if [ "$STATE" = "open" ]; then
            gh issue close "$NUMBER" --comment "Nothing needs a manual decision any more (run ${{ github.run_id }})."
            echo "Closed issue #$NUMBER"
          fi
