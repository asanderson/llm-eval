[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-lab"
version = "0.1.0"
description = "Reproducible local LLM offload experiments across platforms, hardware and operating systems"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
telemetry = ["psutil>=6,<8"]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
