[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-lab"
version = "0.3.0"
description = "Reproducible LLM offloading and routing experiments across hardware and inference platforms"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
telemetry = ["psutil>=6,<8"]
reporting = ["matplotlib>=3.8,<4"]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
